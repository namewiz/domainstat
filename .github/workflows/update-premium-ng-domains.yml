name: Update premium .ng domains

on:
  workflow_dispatch:
  schedule:
    # 03:17 UTC every Monday. Off-the-hour to avoid the top-of-hour scheduler crush.
    - cron: '17 3 * * 1'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fails (without touching the file) if the source is unreachable, the
      # page structure changed and yields zero domains, or more than 50
      # domains would be removed in one run — see scripts/update-premium-ng-domains.mjs.
      - name: Refresh list
        run: node scripts/update-premium-ng-domains.mjs

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet -- src/premium-ng-domains.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/premium-ng-domains.json
          git commit -m "chore(data): refresh premium .ng domains list"
          git push origin HEAD:main
